# LiteLLM proxy — routes all models through the homelab gateway
# api_key_name: openai refers to the LiteLLM master key set via: llm keys set openai <master-key>

# ─── OpenAI via LiteLLM ───────────────────────────────────────────────────────
- model_id: litellm/gpt-4o
  model_name: gpt-4o
  api_base: "https://litellm.lab.hiteshp.in"
  api_key_name: openai

- model_id: litellm/gpt-4o-mini
  model_name: gpt-4o-mini
  api_base: "https://litellm.lab.hiteshp.in"
  api_key_name: openai

